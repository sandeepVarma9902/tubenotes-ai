<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 16px; font: 13px/1.5 system-ui, sans-serif; background: #111827; color: #e5e7eb; }
  h1 { font-size: 15px; margin: 0 0 4px; color: #fff; }
  #vtitle { color: #9ca3af; font-size: 12px; margin-bottom: 10px; word-break: break-word; }
  #pstatus { font-size: 12px; margin-bottom: 12px; min-height: 18px; color: #9ca3af; }
  #pstatus.st-analyzing { color: #fbbf24; } #pstatus.st-done { color: #4ade80; }
  #pstatus.st-need-key, #pstatus.st-error { color: #f87171; }
  button { display: block; width: 100%; margin: 6px 0; padding: 9px; border: none; border-radius: 8px;
    background: #4f46e5; color: #fff; font: 600 13px system-ui; cursor: pointer; }
  button:hover { background: #4338ca; }
  button.ghost { background: #374151; }
  button.ghost:hover { background: #4b5563; }
  #hint { color: #9ca3af; font-size: 12px; text-align: center; padding: 18px 4px; }
</style>
</head>
<body>
  <div id="main">
    <h1>TubeNotes AI</h1>
    <div id="vtitle"></div>
    <div id="pstatus"></div>
    <button id="b-open">Open notes panel</button>
    <button id="b-retry" class="ghost">Re-analyse this video</button>
    <button id="b-opts" class="ghost">Settings</button>
  </div>
  <div id="hint" hidden>Open a YouTube video, then click the ✎ button on the page.</div>
  <script src="popup.js"></script>
</body>
</html>
